services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: alec
      POSTGRES_USER: alec
      POSTGRES_PASSWORD: alec-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./alec/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  alec-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ALEC_DATABASE_URL: postgresql://alec:alec-dev-password@postgres:5432/alec
      ALEC_ANTHROPIC_API_KEY: ${ALEC_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      ALEC_USE_REAL_EMBEDDINGS: "true"
    depends_on:
      - postgres
    command: ["python", "-m", "alec.api.main"]

  alec-frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - alec-api

volumes:
  pgdata:
