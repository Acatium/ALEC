[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alec"
version = "5.0.0"
description = "Adaptive Learning & Execution Core - Knowledge discovery through coordinated AI agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "numpy",
    "pgvector>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "aioresponses>=0.7.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: marks tests that require real LLM API (deselect with '-m \"not smoke\"')",
    "db: marks tests that require a running PostgreSQL database",
]

[tool.coverage.run]
source = ["alec"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
include = ["alec*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "pgvector.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "aiohttp",
    "aiohttp.*",
    "bs4",
    "bs4.*",
    "aioresponses",
    "aioresponses.*",
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
    "websockets",
    "websockets.*",
    "httpx",
    "httpx.*",
    "networkx",
    "networkx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "alec.db.pool",
    "alec.knowledge.repositories.*",
    "alec.runtime.supervisor",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "alec.api.routes.knowledge",
    "alec.api.routes.research",
    "alec.api.routes.engagements",
    "alec.api.routes.ws",
]
disallow_untyped_decorators = false
