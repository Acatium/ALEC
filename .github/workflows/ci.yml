name: CI

# Runs on the default branch (v5) and its PRs.
# Scope: the offline-runnable unit suite (no DB, no network, fully mocked) + ruff.
# Integration / component / smoke tiers need Postgres + a live LLM and are not run here.
on:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with dev extras
        # The dev extras (hypothesis, aioresponses, httpx) are REQUIRED for test
        # collection — a plain `pip install -e .` then pytest fails on 3 files.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check alec/ tests/

      - name: Unit tests
        run: pytest tests/unit -v
